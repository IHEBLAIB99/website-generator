<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sample Site Maker</title>
<style>
:root{--bg:#f6f5f1;--ink:#1c2321;--mut:#5c6662;--line:#d9d6cc;--card:#fff;--ac:#1f5f4a;--act:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a19;--ink:#eef1ef;--mut:#a3aeaa;--line:#2f3835;--card:#1f2523;--ac:#6fcfae;--act:#0e1a16}}
:root[data-theme="dark"]{--bg:#161a19;--ink:#eef1ef;--mut:#a3aeaa;--line:#2f3835;--card:#1f2523;--ac:#6fcfae;--act:#0e1a16}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh}
aside{padding:28px 24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
h1{font:600 24px/1.2 Georgia,serif;margin:0}
p.lead{margin:0;color:var(--mut)}
h2{font-size:15px;margin:0 0 8px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types button{padding:12px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;text-align:left;cursor:pointer}
.types button[aria-pressed="true"]{border-color:var(--ac);box-shadow:inset 0 0 0 2px var(--ac);font-weight:600}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.go{flex:1;padding:13px 16px;border:0;border-radius:8px;background:var(--ac);color:var(--act);font:600 16px inherit;font-family:inherit;cursor:pointer}
.alt{padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#msg{min-height:22px;margin:0;font-size:14px;color:var(--mut)}
#msg.err{color:#c0392b}
main{padding:20px;display:flex;flex-direction:column;min-width:0}
.frame{flex:1;min-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden;display:flex}
iframe{border:0;width:100%;flex:1;background:#fff}
.empty{margin:auto;max-width:320px;text-align:center;color:var(--mut);padding:24px}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div><h1>Sample Site Maker</h1><p class="lead">Pick a business type and get a working sample website with illustrations.</p></div>
  <div><h2 id="th">1. What kind of website?</h2><div class="types" id="types" role="group" aria-labelledby="th"></div></div>
  <div><h2><label for="name">2. Business name (optional)</label></h2><input id="name" maxlength="40" placeholder="Leave blank for a sample name" autocomplete="off"></div>
  <div class="row"><button class="go" id="gen">Generate website</button><button class="alt" id="shuf">New look</button></div>
  <div class="row"><button class="alt" id="copy">Copy HTML</button></div>
  <p id="msg" role="status" aria-live="polite"></p>
</aside>
<main><div class="frame" id="frame"><div class="empty">Your sample website will appear here. Choose a business type, then press Generate website.</div></div></main>
</div>
<script>
const D={
restaurant:{label:'Restaurant',def:'Juniper Table',tag:'Seasonal food, shared tables.',sub:'A neighborhood kitchen cooking with what is growing nearby.',items:[['Dinner','A short, changing menu built around local farms.'],['Weekend brunch','Slow mornings, fresh bread and good coffee.'],['Private dining','A room for up to 24 guests with a set menu.']],cta:'Reserve a table',about:'We opened with one idea: good food tastes better when people sit close. Everything on the menu is cooked in house from ingredients we know by name.',info:'Open Tuesday to Sunday, 5pm to 10pm',pal:[['#fbf6ee','#2b1d16','#a2362a','#fff'],['#1c1a17','#f3ead9','#e0b25a','#1c1a17'],['#f1f4ec','#1f2a1f','#3d6b3a','#fff']]},
salon:{label:'Hair salon',def:'Studio Marlow',tag:'Hair that suits how you live.',sub:'Cuts, color and care from a small team that listens first.',items:[['Cut and style','A consultation, a wash and a finish you can repeat at home.'],['Color','Gloss, highlights and full color with gentle products.'],['Treatments','Repair and scalp care for tired or damaged hair.']],cta:'Book an appointment',about:'Studio Marlow is a four-chair salon. We keep appointments unhurried so every visit starts with a conversation, not a rush.',info:'Open Wednesday to Saturday, 9am to 7pm',pal:[['#fdf1f0','#3a2327','#b23a5a','#fff'],['#f4efe9','#2c2a28','#7b5e4b','#fff'],['#201a24','#f4e9f2','#e7a3d0','#201a24']]},
gym:{label:'Gym',def:'Ironwood Fitness',tag:'Train with a plan.',sub:'Coached classes and open floor space for every level.',items:[['Strength classes','Small groups led by a coach who tracks your progress.'],['Open gym','Racks, free weights and cardio, open early and late.'],['Personal training','One-to-one programs built around your goals.']],cta:'Start a free trial',about:'We built Ironwood for people who want results without the guesswork. Every member gets a starter session and a written plan.',info:'Open daily, 5am to 11pm',pal:[['#111418','#f2f4f5','#c6f23a','#111418'],['#f5f5f2','#14181c','#d4380d','#fff'],['#0f2233','#eaf2f8','#ffb020','#0f2233']]},
law:{label:'Law firm',def:'Hale & Reyes Law',tag:'Clear advice. Careful work.',sub:'Legal help for families and small businesses, explained in plain language.',items:[['Family law','Guidance through divorce, custody and agreements.'],['Business law','Contracts, formation and everyday legal questions.'],['Estate planning','Wills, trusts and plans that protect your family.']],cta:'Request a consultation',about:'Our firm was founded to make legal services understandable. We explain your options, give you a clear fee estimate and keep you informed.',info:'Open Monday to Friday, 9am to 5pm',pal:[['#f6f4ef','#16202e','#1d3a63','#fff'],['#ffffff','#1a1a1a','#7a1f2b','#fff'],['#14202b','#e9eef2','#c9a45c','#14202b']]},
photo:{label:'Photographer',def:'Ada Okoye Photography',tag:'Photographs with room to breathe.',sub:'Portraits, weddings and events, shot in natural light.',items:[['Portraits','Relaxed sessions for individuals, couples and families.'],['Weddings','Full-day coverage and a finished gallery of your day.'],['Events','Launches, parties and gatherings, captured candidly.']],cta:'Check availability',about:'I photograph people as they are. Sessions are calm and unscripted, and every client receives a private online gallery.',info:'Booking sessions for the coming season',pal:[['#fafafa','#161616','#161616','#fff'],['#151515','#f0f0f0','#f0f0f0','#151515'],['#efe9e1','#2a2622','#5b4a3a','#fff']]},
shop:{label:'Online store',def:'Northfield Goods',tag:'Everyday things, made well.',sub:'Home and desk essentials chosen for quality and longevity.',items:[['Home','Linens, ceramics and kitchen tools that last.'],['Desk','Notebooks, lamps and organizers for focused work.'],['Gifts','Boxed sets and cards, wrapped and ready to send.']],cta:'Shop the collection',about:'We stock a small range and replace what we sell for as long as we can. Every item is tested by our team before it is listed.',info:'Free shipping on orders over $50',pal:[['#f7fbff','#14263a','#0b63ce','#fff'],['#fff7e8','#2c2110','#c25b00','#fff'],['#f3f0fa','#221b3a','#5a3fc0','#fff']]}
};
const FONTS=['Georgia,"Times New Roman",serif','system-ui,-apple-system,"Segoe UI",Arial,sans-serif','"Trebuchet MS","Gill Sans",Verdana,sans-serif'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let type=null,look=0,html='';
const $=id=>document.getElementById(id),msg=(t,e)=>{$('msg').textContent=t;$('msg').className=e?'err':''};

const DONE={restaurant:'We received your table request and will confirm by email.',salon:'Your appointment request is in. We will email you a time.',gym:'Your free trial is booked. Check your email for details.',law:'Your consultation request was received. We will reply within one business day.',photo:'Thanks for reaching out. I will email you about availability.',shop:'Your order was placed. A confirmation is on its way.'};
const M={
restaurant:(a,k)=>`<circle cx="200" cy="140" r="62" fill="${k}"/><circle cx="200" cy="140" r="44" fill="${a}"/><rect x="92" y="90" width="6" height="100" rx="3" fill="${k}"/><rect x="302" y="90" width="6" height="100" rx="3" fill="${k}"/>`,
salon:(a,k)=>`<ellipse cx="200" cy="120" rx="52" ry="68" fill="none" stroke="${k}" stroke-width="8"/><ellipse cx="200" cy="120" rx="40" ry="56" fill="${a}"/><rect x="194" y="190" width="12" height="44" fill="${k}"/>`,
gym:(a,k)=>`<rect x="120" y="132" width="160" height="14" fill="${k}"/><rect x="100" y="104" width="22" height="70" rx="4" fill="${a}"/><rect x="278" y="104" width="22" height="70" rx="4" fill="${a}"/><rect x="78" y="116" width="18" height="46" rx="4" fill="${k}"/><rect x="304" y="116" width="18" height="46" rx="4" fill="${k}"/>`,
law:(a,k)=>`<rect x="196" y="60" width="8" height="150" fill="${k}"/><rect x="110" y="70" width="180" height="8" fill="${k}"/><path d="M110 78 L80 140 H140 Z" fill="${a}"/><path d="M290 78 L260 140 H320 Z" fill="${a}"/><rect x="150" y="208" width="100" height="10" rx="3" fill="${k}"/>`,
photo:(a,k,b)=>`<rect x="110" y="86" width="180" height="116" rx="14" fill="${k}"/><rect x="160" y="70" width="50" height="22" rx="4" fill="${k}"/><circle cx="200" cy="146" r="38" fill="${a}" stroke="${b}" stroke-width="6"/><circle cx="200" cy="146" r="18" fill="${b}"/>`,
shop:(a,k)=>`<path d="M150 100 Q150 60 200 60 Q250 60 250 100" fill="none" stroke="${k}" stroke-width="8"/><rect x="120" y="96" width="160" height="124" rx="10" fill="${a}"/><circle cx="170" cy="120" r="6" fill="${k}"/><circle cx="230" cy="120" r="6" fill="${k}"/>`
};
const T={
restaurant:{team:[['Maria Costa','Head chef'],['Dev Patel','Front of house'],['Lena Brandt','Pastry']],q:[['The best meal we had all year, and they made our anniversary feel special.','Hannah R.'],['I come every Friday. The menu changes but the welcome never does.','Tomas G.'],['Brunch was unhurried, warm and delicious.','Priya S.']],faq:[['Do you take walk-ins?','Yes, we keep half the room for walk-ins. Booking guarantees your table.'],['Can you cater for allergies?','Tell us when you book and the kitchen will plan around it.']]},
salon:{team:[['Nina Alvarez','Owner and colorist'],['Sam Okafor','Senior stylist'],['Jo Whitfield','Stylist']],q:[['Nina listened and gave me the color I could never describe.','Claire D.'],['Finally a salon where nobody rushes you.','Marcus L.'],['My cut still looks great six weeks later.','Aisha K.']],faq:[['How long does color take?','Most appointments take two to three hours. We will give you an estimate when you book.'],['Do you cut kids\' hair?','Yes, children are always welcome.']]},
gym:{team:[['Jake Moreno','Head coach'],['Tara Singh','Strength coach'],['Ollie Grant','Front desk']],q:[['I lifted my first barbell here, and the coaches cheered louder than I did.','Beth W.'],['Clean, friendly and never too crowded.','Rahul M.'],['The written plan changed how I train.','Dana P.']],faq:[['Is the free trial really free?','Yes. No card is needed and there is no obligation.'],['I am a beginner. Is that okay?','Absolutely. Every member gets a starter session with a coach.']]},
law:{team:[['Elena Hale','Partner, family law'],['Marcus Reyes','Partner, business law'],['Grace Tan','Paralegal']],q:[['They explained everything in plain words and never made me feel small.','Robert A.'],['Fair fees and fast replies during a stressful time.','Julia F.'],['Our small business finally has contracts we understand.','Omar H.']],faq:[['What does a first consultation cost?','The first 30-minute consultation is free.'],['How quickly will you reply?','We answer every request within one business day.']]},
photo:{team:[['Ada Okoye','Photographer'],['Ben Cho','Second shooter'],['Mia Lund','Editor']],q:[['Ada made us laugh, and the photos look like us on our best day.','Sofia and Ian'],['I have never liked photos of myself until now.','Greg T.'],['Our gallery arrived early and was perfect.','Nadia B.']],faq:[['How soon will I get my photos?','Portraits arrive in one week and weddings in four.'],['Do you travel?','Yes, travel within 50 miles is included.']]},
shop:{team:[['Hannah Moss','Founder'],['Luis Ortega','Product tester'],['Kim Park','Customer care']],q:[['The mug is lovely, and they replaced it quickly when it chipped.','Eva N.'],['Everything arrived beautifully wrapped.','Tom B.'],['My desk finally looks the way I wanted.','Yuki S.']],faq:[['How long does shipping take?','Orders arrive in three to five working days.'],['Can I return an item?','Yes, within 30 days if it is unused.']]}
};
const SK=['#f1c9a5','#e0a97e','#c68863','#8d5a3b','#f6d7bd'],HR=['#2b1b12','#5a3720','#c8892b','#111','#9a9a9a'],CAP=['A glimpse of the space','Made with care','Our regulars','Behind the scenes','Fresh this week','Details we love'];
function person(i,a,k,b){const s=SK[i%5],h=HR[(i*2+1)%5];return `<svg viewBox="0 0 120 120" role="img" aria-label="Portrait illustration"><rect width="120" height="120" fill="${a}" opacity=".2"/><path d="M18 120 Q20 82 60 82 Q100 82 102 120Z" fill="${a}"/><rect x="52" y="68" width="16" height="18" fill="${s}"/><circle cx="60" cy="52" r="24" fill="${s}"/><path d="M36 50 Q36 24 60 24 Q84 24 84 50 Q74 36 60 36 Q46 36 36 50Z" fill="${h}"/><circle cx="51" cy="54" r="2.5" fill="#222"/><circle cx="69" cy="54" r="2.5" fill="#222"/><path d="M51 63 Q60 70 69 63" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/></svg>`}
function art(t,i,a,k,b){
  const r=[0,-6,5,-3,8,-9][i],s=[1,.9,1.1,.85,1,1.15][i];
  return `<svg viewBox="0 0 400 260" role="img" aria-label="Illustration"><rect width="400" height="260" fill="${a}" opacity=".16"/><circle cx="${(40+i*83)%340+30}" cy="${30+(i*37)%150}" r="${50+(i*13)%40}" fill="${a}" opacity=".25"/><g transform="rotate(${r} 200 130) translate(200 130) scale(${s}) translate(-200 -130)">${M[t](a,k,b)}</g></svg>`;
}
function extra(t,d,a,k,b){
  const x=T[t],n=x.team[0],ppl=t.length;
  const team=x.team.map((m,i)=>`<figure class="p"><div class="im">${person(i+ppl,a,k,b)}</div><figcaption><b>${esc(m[0])}</b><br>${esc(m[1])}</figcaption></figure>`).join('');
  const gal=CAP.map((c,i)=>`<button class="gt" type="button" data-cap="${esc(c)}" aria-label="Enlarge: ${esc(c)}">${art(t,i,a,k,b)}</button>`).join('');
  const rev=x.q.map((m,i)=>`<div class="rv"><div class="im av">${person(i+ppl+3,a,k,b)}</div><p>&ldquo;${esc(m[0])}&rdquo;</p><b>${esc(m[1])}</b></div>`).join('');
  const faq=x.faq.map(m=>`<details><summary>${esc(m[0])}</summary><p>${esc(m[1])}</p></details>`).join('');
  return `<section id="about"><h2>About us</h2><div class="fo"><div class="im av">${person(ppl,a,k,b)}</div><div><p class="ab">${esc(d.about)}</p><p class="sig">${esc(n[0])}, ${esc(n[1].toLowerCase())}</p></div></div></section>
<section id="team"><h2>Meet the team</h2><div class="g">${team}</div></section>
<section id="gallery"><h2>Gallery</h2><p>Tap any picture to enlarge it.</p><div class="gg">${gal}</div></section>
<section id="reviews"><h2>What people say</h2>${rev}<div class="nv"><button class="btn s" id="prev" type="button">Previous</button><span id="rn"></span><button class="btn s" id="next" type="button">Next</button></div></section>
<section id="faq"><h2>Questions, answered</h2>${faq}</section>
<div id="lb" hidden role="dialog" aria-label="Image viewer"><div class="lbx"><div class="lbi"></div><p class="cap"></p><button class="btn s" type="button">Close</button></div></div>`;
}
function build(t,name,v){
  const d=D[t],[bg,ink,ac,bt]=d.pal[v%3],font=FONTS[(v+Object.keys(D).indexOf(t))%3],center=v%2===1,n=esc(name),shop=t==='shop',pick=shop?'Add to cart':'Select';
  const cards=d.items.map((i,x)=>'<div class="c"><div class="im">'+art(t,x+1,ac,ink,bg)+'</div><h3>'+esc(i[0])+'</h3><p>'+esc(i[1])+'</p><button class="btn s" type="button" data-pick="'+esc(i[0])+'" data-label="'+pick+'">'+pick+'</button></div>').join('');
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${n}</title><style>
*{box-sizing:border-box}body{margin:0;background:${bg};color:${ink};font:17px/1.6 ${font}}
a{color:inherit}.w{max-width:1000px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;flex-wrap:wrap}nav b{font-size:20px}nav div{display:flex;gap:20px}nav a{text-decoration:none}
.hero{display:grid;gap:36px;padding:48px 0 56px;align-items:center;grid-template-columns:${center?'1fr':'1.1fr 1fr'};text-align:${center?'center':'left'}}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.1;margin:0 0 16px}.hero p{font-size:20px;margin:0 0 28px;opacity:.85}
.btn{display:inline-block;background:${ac};color:${bt};padding:14px 26px;border-radius:${v%3===0?'4px':'999px'};text-decoration:none;font:inherit;font-weight:600;border:0;cursor:pointer}
.btn:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid ${ac};outline-offset:2px}
section{padding:52px 0;border-top:1px solid ${ink}33}h2{font-size:28px;margin:0 0 24px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.c{padding:18px;border:1px solid ${ink}33;border-top:4px solid ${ac};border-radius:4px}.c h3{margin:14px 0 8px}.c p{margin:0}
.im svg{display:block;width:100%;height:auto;border-radius:4px}.s{margin-top:14px;padding:8px 18px;font-size:15px}
.ab{max-width:36em}.f{display:grid;gap:12px;max-width:420px;margin:16px 0}
input{width:100%;padding:12px;border:1px solid ${ink}88;background:transparent;color:inherit;font:inherit;border-radius:4px}
#fm{font-weight:600;min-height:1.6em}footer{padding:32px 0;border-top:1px solid ${ink}33;font-size:15px;opacity:.85}
.hero p.hi{font-size:17px;font-style:italic;margin:0 0 10px;opacity:1}
.fo{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.av{width:110px;flex:none}.av svg{border-radius:50%}.sig{font:italic 26px 'Brush Script MT','Segoe Script',cursive;margin:8px 0 0}
.p{margin:0}.p figcaption{margin-top:10px}
.gg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}.gt{padding:0;border:0;background:none;cursor:pointer;border-radius:4px;overflow:hidden}.gt svg{display:block;width:100%;height:auto;transition:transform .2s}.gt:hover svg{transform:scale(1.06)}.gt:focus-visible{outline:3px solid ${ac};outline-offset:2px}
.rv{display:flex;gap:20px;align-items:center;flex-wrap:wrap;max-width:44em}.rv[hidden],#lb[hidden]{display:none}.rv p{font-size:20px;margin:0;flex:1 1 260px}.nv{display:flex;gap:16px;align-items:center;margin-top:20px}.nv .s{margin:0}
details{border-bottom:1px solid ${ink}33;padding:14px 0;max-width:40em}summary{cursor:pointer;font-weight:600}details p{margin:10px 0 0}
#lb{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:20px;z-index:9}.lbx{background:${bg};padding:16px;max-width:560px;width:100%;border-radius:8px}.lbi svg{display:block;width:100%;height:auto}.cap{margin:10px 0}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
</style></head><body><div class="w"><nav><b>${n}</b><div><a href="#services">Services</a><a href="#gallery">Gallery</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a><span>${shop?'Cart':'Selected'}: <b id="cnt">0</b></span></div></nav>
<header class="hero"><div><p class="hi" id="hi"></p><h1>${esc(d.tag)}</h1><p>${esc(d.sub)}</p><a class="btn" href="#contact">${esc(d.cta)}</a></div><div class="im">${art(t,0,ac,ink,bg)}</div></header>
<section id="services"><h2>What we offer</h2><div class="g">${cards}</div></section>
${extra(t,d,ac,ink,bg)}
<section id="contact"><h2>Get in touch</h2><p>${esc(d.info)}</p><p id="sel">Nothing selected yet.</p>
<div class="f"><input id="fn" placeholder="Your name" aria-label="Your name"><input id="fe" type="email" placeholder="Email address" aria-label="Email address"><button class="btn" id="send" type="button" data-done="${esc(DONE[t])}">${esc(d.cta)}</button></div><p id="fm" role="status"></p></section>
<footer>&copy; 2026 ${n}. Sample website with placeholder content. hello@example.com | (555) 010-0123</footer></div>
<script>
var sel=[],cnt=document.getElementById('cnt'),lst=document.getElementById('sel'),fm=document.getElementById('fm');
function draw(){cnt.textContent=sel.length;lst.textContent=sel.length?'Selected: '+sel.join(', '):'Nothing selected yet.';}
document.querySelectorAll('[data-pick]').forEach(function(b){b.addEventListener('click',function(){var n=b.getAttribute('data-pick'),i=sel.indexOf(n);if(i<0){sel.push(n);b.textContent='Remove';}else{sel.splice(i,1);b.textContent=b.getAttribute('data-label');}draw();});});
document.querySelectorAll('a[href^="#"]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var t=document.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth'});});});
document.getElementById('send').addEventListener('click',function(){var n=document.getElementById('fn').value.trim(),m=document.getElementById('fe').value.trim(),at=m.indexOf('@');
if(!n||at<1||m.indexOf('.',at)<at+2||m.indexOf(' ')>=0){fm.textContent='Please enter your name and a valid email address.';return;}
fm.textContent='Thanks, '+n+'. '+this.getAttribute('data-done')+(sel.length?' ('+sel.join(', ')+')':'');});
var h=new Date().getHours();document.getElementById('hi').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', and welcome.';
var rv=[].slice.call(document.querySelectorAll('.rv')),ri=0,rn=document.getElementById('rn');
function show(n){ri=(n+rv.length)%rv.length;rv.forEach(function(e,i){e.hidden=i!==ri;});rn.textContent=(ri+1)+' of '+rv.length;}
document.getElementById('prev').addEventListener('click',function(){show(ri-1);});document.getElementById('next').addEventListener('click',function(){show(ri+1);});show(0);
var lb=document.getElementById('lb');
document.querySelectorAll('.gt').forEach(function(g){g.addEventListener('click',function(){lb.querySelector('.lbi').innerHTML=g.innerHTML;lb.querySelector('.cap').textContent=g.getAttribute('data-cap');lb.hidden=false;lb.querySelector('button').focus();});});
lb.addEventListener('click',function(e){if(e.target===lb||e.target.tagName==='BUTTON')lb.hidden=true;});
document.addEventListener('keydown',function(e){if(e.key==='Escape')lb.hidden=true;});
<\/script></body></html>`;
}

function render(){
  html=build(type,$('name').value.trim()||D[type].def,look);
  const f=document.createElement('iframe');f.title='Sample website preview';f.setAttribute('sandbox','allow-scripts');f.srcdoc=html;
  $('frame').replaceChildren(f);
}
Object.entries(D).forEach(([k,d])=>{
  const b=document.createElement('button');b.textContent=d.label;b.setAttribute('aria-pressed','false');
  b.onclick=()=>{type=k;document.querySelectorAll('#types button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));msg('');};
  $('types').appendChild(b);
});
$('gen').onclick=()=>{if(!type){msg('Choose a business type first.',true);return}look=0;render();msg('Generated a '+D[type].label.toLowerCase()+' website.')};
$('shuf').onclick=()=>{if(!type){msg('Choose a business type first.',true);return}look=(look+1)%3;render();msg('Showing look '+(look+1)+' of 3.')};
$('copy').onclick=async()=>{
  if(!html){msg('Generate a website first.',true);return}
  try{await navigator.clipboard.writeText(html);msg('HTML copied. Paste it into a file named index.html.')}
  catch(e){msg('Copy was blocked by the browser. Try again after clicking the page.',true)}
};
